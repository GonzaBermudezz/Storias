<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Panel Storias — Opción 3</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap">
  <style>
    :root{--bg:#F5F1E8;--surface:#EDE8DC;--border:#D5CCBA;--fg:#1C1410;--muted:#6B5F52;--accent:#C94F1A;--accent2:#A83D12;--drawer-w:260px}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--fg);font-family:'Geist',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}

    /* ── NAV ── */
    nav{display:flex;align-items:center;gap:12px;padding:0 20px;height:56px;border-bottom:1px solid var(--border);background:rgba(245,241,232,.95);backdrop-filter:blur(12px);position:sticky;top:0;z-index:50}
    .hamburger{background:none;border:none;cursor:pointer;font-size:20px;color:var(--fg);width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px;transition:background .15s}
    .hamburger:hover{background:var(--surface)}
    .logo{font-size:17px;font-weight:800;letter-spacing:-.04em}
    .logo span{color:var(--accent)}
    .nav-right{display:flex;align-items:center;gap:8px;margin-left:auto}
    .client-pill{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:4px 12px 4px 6px;cursor:pointer;font-size:13px;font-weight:600;transition:border-color .15s}
    .client-pill:hover{border-color:var(--accent)}
    .ca{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
    .ca1{background:#C94F1A}.ca2{background:#6366F1}.ca3{background:#0EA5E9}.ca4{background:#10B981}.ca5{background:#F59E0B}
    .nav-tab{padding:6px 12px;border-radius:8px;border:none;background:transparent;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .1s}
    .nav-tab:hover{background:var(--surface);color:var(--fg)}
    .nav-tab.active{background:rgba(201,79,26,.1);color:var(--accent)}

    /* ── DRAWER ── */
    .drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:90;opacity:0;pointer-events:none;transition:opacity .25s}
    .drawer-overlay.open{opacity:1;pointer-events:all}
    .drawer{position:fixed;top:0;left:0;bottom:0;width:var(--drawer-w);background:var(--bg);border-right:1px solid var(--border);z-index:100;transform:translateX(-100%);transition:transform .25s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
    .drawer.open{transform:translateX(0)}
    .drawer-head{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--border)}
    .drawer-head .logo{font-size:15px}
    .close-btn{background:none;border:none;cursor:pointer;font-size:18px;color:var(--muted);width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:6px}
    .close-btn:hover{background:var(--surface)}
    .drawer-search{padding:10px 12px;border-bottom:1px solid var(--border)}
    .drawer-search input{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-size:13px;color:var(--fg);font-family:inherit}
    .drawer-search input:focus{outline:none;border-color:var(--accent)}
    .drawer-list{flex:1;overflow-y:auto;padding:8px 0}
    .drawer-item{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;transition:background .1s;font-size:13px;font-weight:500}
    .drawer-item:hover{background:var(--surface)}
    .drawer-item.active{background:rgba(201,79,26,.08);color:var(--accent)}
    .status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-left:auto}
    .dot-pending{background:#F59E0B}.dot-sent{background:#6366F1}.dot-approved{background:#10B981}
    .drawer-footer{padding:12px;border-top:1px solid var(--border)}
    .btn-new{width:100%;padding:9px;border-radius:9px;border:1.5px dashed var(--border);background:transparent;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
    .btn-new:hover{border-color:var(--accent);color:var(--accent)}

    /* ── MAIN ── */
    main{max-width:900px;margin:0 auto;padding:32px 20px}
    .section-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
    .client-header{display:flex;align-items:center;gap:14px;margin-bottom:24px}
    .client-header .avatar-lg{width:48px;height:48px;border-radius:50%;font-size:16px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .client-header h2{font-size:22px;font-weight:800;letter-spacing:-.03em}
    .client-header p{font-size:13px;color:var(--muted);margin-top:2px}
    .header-actions{margin-left:auto;display:flex;gap:8px}
    .btn-outline{padding:8px 14px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
    .btn-outline:hover{border-color:var(--fg);color:var(--fg)}
    .btn-accent{padding:8px 14px;border-radius:9px;border:none;background:var(--accent);color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s}
    .btn-accent:hover{background:var(--accent2)}

    /* Story group */
    .group-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px}
    .group-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
    .group-date{font-size:13px;font-weight:700}
    .group-time{font-size:12px;color:var(--muted)}
    .group-meta-right{display:flex;align-items:center;gap:8px}
    .badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px}
    .badge-pending{background:rgba(245,158,11,.12);color:#B45309}
    .badge-sent{background:rgba(99,102,241,.1);color:#6366F1}
    .badge-approved{background:rgba(16,185,129,.1);color:#059669}

    /* Story grid */
    .stories-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
    .story-card{border-radius:10px;overflow:hidden;aspect-ratio:9/16;position:relative;background:#1a1a1a;cursor:pointer}
    .story-card img{width:100%;height:100%;object-fit:cover;display:block}
    .story-card .overlay{position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.75));display:flex;flex-direction:column;justify-content:flex-end;padding:8px}
    .story-card .story-text{font-size:9px;color:#fff;line-height:1.3;font-weight:500}
    /* Edit overlay on hover */
    .story-card .edit-overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
    .story-card:hover .edit-overlay{opacity:1}
    .btn-edit-story{background:rgba(255,255,255,.9);border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;color:#1C1410;font-family:inherit}
    .story-num-badge{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.5);color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:99px;backdrop-filter:blur(4px)}

    /* Actions */
    .group-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .btn-wa{display:flex;align-items:center;gap:7px;padding:9px 16px;border-radius:9px;border:none;background:#25D366;color:#fff;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit}
    .btn-wa:hover{background:#1db954}
    .btn-preview{padding:9px 14px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
    .btn-preview:hover{border-color:var(--fg);color:var(--fg)}
    .btn-add-story-row{padding:9px 14px;border-radius:9px;border:1.5px dashed var(--border);background:transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
    .btn-add-story-row:hover{border-color:var(--accent);color:var(--accent)}
    .btn-del-group{padding:9px 12px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s;margin-left:auto}
    .btn-del-group:hover{border-color:#ef4444;color:#ef4444}

    /* Empty state */
    .empty-client{text-align:center;padding:60px 20px;color:var(--muted)}
    .empty-client .icon{font-size:40px;margin-bottom:14px}
    .empty-client p{font-size:14px;margin-bottom:20px;line-height:1.6}

    /* ── CALENDARIO VIEW ── */
    #cal-view{display:none;max-width:900px;margin:0 auto;padding:32px 20px}
    .cal-layout{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
    .calendar-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px}
    .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .cal-title{font-size:14px;font-weight:800;letter-spacing:-.02em}
    .cal-nav{display:flex;gap:4px}
    .cal-nav button{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--fg);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;font-family:inherit}
    .cal-nav button:hover{background:var(--border)}
    .cal-days-header{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:6px}
    .cal-day-name{text-align:center;font-size:10px;font-weight:700;color:var(--muted);padding:4px 0;text-transform:uppercase;letter-spacing:.05em}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
    .cal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;position:relative;transition:background .1s;user-select:none}
    .cal-cell:hover:not(.empty){background:var(--border)}
    .cal-cell.empty{cursor:default;color:rgba(28,20,16,.25)}
    .cal-cell.today{background:rgba(201,79,26,.12);color:var(--accent);font-weight:800}
    .cal-cell.selected{background:var(--accent)!important;color:#fff!important}
    .cal-cell.has-post::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--accent)}
    .cal-cell.selected.has-post::after{background:#fff}
    .day-panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
    .day-panel-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
    .day-panel-title{font-size:13px;font-weight:800}
    .day-panel-sub{font-size:11px;color:var(--muted);margin-top:2px}
    .day-story-list{padding:12px}
    .day-story-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:var(--bg);border:1px solid var(--border);margin-bottom:8px;transition:border-color .15s}
    .day-story-row:hover{border-color:var(--accent)}
    .day-thumb{width:36px;height:64px;border-radius:6px;object-fit:cover;flex-shrink:0;background:#ccc}
    .day-story-info{flex:1;min-width:0}
    .day-story-num{font-size:10px;font-weight:700;color:var(--muted);margin-bottom:3px}
    .day-story-cap{font-size:12px;font-weight:500;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .day-story-actions{display:flex;gap:4px;flex-shrink:0}
    .btn-icon{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:background .1s}
    .btn-icon:hover{background:var(--border)}
    .empty-day{padding:28px 16px;text-align:center;color:var(--muted);font-size:13px}

    /* ── MODALS ── */
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
    .modal-bg.open{display:flex}
    .modal{background:var(--bg);border:1px solid var(--border);border-radius:18px;width:100%;max-width:480px;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.18)}
    .modal-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
    .modal-head h3{font-size:15px;font-weight:800}
    .modal-close{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:transparent;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
    .modal-body{padding:20px;display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto}
    .field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
    .field input,.field textarea,.field select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--fg);font-size:13px;font-family:inherit}
    .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent)}
    .field textarea{resize:none;line-height:1.5}
    .img-preview-row{display:flex;gap:12px;align-items:flex-start}
    .img-preview{width:72px;height:128px;border-radius:10px;object-fit:cover;background:var(--border);flex-shrink:0}
    .img-controls{flex:1;display:flex;flex-direction:column;gap:8px}
    .btn-rand-img{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .1s;text-align:center}
    .btn-rand-img:hover{background:var(--border)}
    .modal-footer{padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:8px}
    .btn-cancel-m{flex:1;padding:11px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
    .btn-save-m{flex:2;padding:11px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s}
    .btn-save-m:hover{background:var(--accent2)}

    .btn-back-menu{position:fixed;bottom:20px;right:20px;z-index:500;background:var(--accent);color:#fff;border:none;border-radius:99px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 16px rgba(201,79,26,.35)}
  </style>
</head>
<body>

<button class="btn-back-menu" onclick="history.back()">← Menú de opciones</button>

<!-- Drawer overlay -->
<div class="drawer-overlay" id="overlay" onclick="closeDrawer()"></div>

<!-- Drawer -->
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="logo">Sto<span>.</span></div>
    <button class="close-btn" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-search">
    <input type="text" placeholder="Buscar cliente…" oninput="filterClients(this.value)">
  </div>
  <div class="drawer-list" id="drawer-list"></div>
  <div class="drawer-footer">
    <button class="btn-new" onclick="closeDrawer();openClientModal('new')">+ Nuevo cliente</button>
  </div>
</div>

<!-- Nav -->
<nav>
  <button class="hamburger" onclick="openDrawer()">☰</button>
  <div class="logo">Sto<span>.</span></div>
  <div class="nav-right">
    <button class="nav-tab active" id="tab-clientes" onclick="switchTab('clientes')">Clientes</button>
    <button class="nav-tab" id="tab-calendario" onclick="switchTab('calendario')">📅 Calendario</button>
    <div class="client-pill" onclick="openDrawer()">
      <div class="ca ca1" id="nav-avatar">CA</div>
      <span id="nav-name">CUAN Arquitectura</span>
      <span style="color:var(--muted);margin-left:2px">▾</span>
    </div>
  </div>
</nav>

<!-- Clientes view -->
<main id="main-content"></main>

<!-- Calendario view -->
<div id="cal-view">
  <div class="section-title" style="margin-bottom:16px">Calendario de publicaciones</div>
  <div class="cal-layout">
    <div>
      <div class="calendar-card">
        <div class="cal-head">
          <div class="cal-title" id="cal-month-label"></div>
          <div class="cal-nav">
            <button onclick="changeMonth(-1)">‹</button>
            <button onclick="changeMonth(1)">›</button>
          </div>
        </div>
        <div class="cal-days-header">
          <div class="cal-day-name">Do</div><div class="cal-day-name">Lu</div><div class="cal-day-name">Ma</div>
          <div class="cal-day-name">Mi</div><div class="cal-day-name">Ju</div><div class="cal-day-name">Vi</div><div class="cal-day-name">Sá</div>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>
    </div>
    <div>
      <div class="day-panel">
        <div class="day-panel-head">
          <div>
            <div class="day-panel-title" id="cal-day-title">Seleccioná un día</div>
            <div class="day-panel-sub" id="cal-day-sub">Hacé click en cualquier día</div>
          </div>
          <button class="btn-accent" id="btn-add-cal" style="display:none;font-size:11px;padding:6px 12px" onclick="addStoryFromCal()">+ Historia</button>
        </div>
        <div id="cal-day-stories"><div class="empty-day">Seleccioná un día para ver las publicaciones programadas</div></div>
      </div>
    </div>
  </div>
</div>

<!-- Client modal -->
<div class="modal-bg" id="client-modal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="client-modal-title">Nuevo cliente</h3>
      <button class="modal-close" onclick="closeClientModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="field"><label>Empresa</label><input id="cfg-empresa" type="text" placeholder="CUAN Arquitectura"></div>
      <div class="field"><label>Contacto</label><input id="cfg-contacto" type="text" placeholder="Lucía Cuan"></div>
      <div class="field"><label>Descripción del negocio</label><textarea id="cfg-desc" rows="2" placeholder="Estudio de arquitectura…"></textarea></div>
      <div class="field"><label>WhatsApp</label><input id="cfg-phone" type="text" placeholder="+54 9 11 1234-5678"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel-m" onclick="closeClientModal()">Cancelar</button>
      <button class="btn-save-m" onclick="saveClientModal()">Guardar cliente</button>
    </div>
  </div>
</div>

<!-- Add group modal -->
<div class="modal-bg" id="group-modal">
  <div class="modal">
    <div class="modal-head">
      <h3>Nueva publicación</h3>
      <button class="modal-close" onclick="closeGroupModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="field"><label>Fecha</label><input id="grp-fecha" type="date"></div>
      <div class="field"><label>Hora de publicación</label><input id="grp-hora" type="time" value="09:00"></div>
      <div class="field"><label>Cliente</label>
        <select id="grp-client"></select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel-m" onclick="closeGroupModal()">Cancelar</button>
      <button class="btn-save-m" onclick="saveGroupModal()">Crear grupo</button>
    </div>
  </div>
</div>

<!-- Story edit modal -->
<div class="modal-bg" id="story-modal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="story-modal-title">Editar historia</h3>
      <button class="modal-close" onclick="closeStoryModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Texto superpuesto</label>
        <textarea id="smod-caption" rows="3" placeholder="Texto que aparece sobre la imagen…"></textarea>
      </div>
      <div class="field">
        <label>Imagen</label>
        <div class="img-preview-row">
          <img class="img-preview" id="smod-preview" src="" alt="">
          <div class="img-controls">
            <div><label style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;display:block">URL de imagen</label>
              <input type="text" id="smod-img" placeholder="https://…" oninput="updateStoryPreview(this.value)">
            </div>
            <button class="btn-rand-img" onclick="randomStoryImg()">🔀 Imagen aleatoria</button>
            <div style="font-size:10px;color:var(--muted)">Proporción ideal: 9:16 (vertical)</div>
          </div>
        </div>
      </div>
      <div class="field"><label>Hora</label><input type="text" id="smod-time" placeholder="09:00"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel-m" onclick="closeStoryModal()">Cancelar</button>
      <button class="btn-save-m" onclick="saveStoryModal()">Guardar</button>
    </div>
  </div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────
const UNSPLASH_ALL = [
  'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=800&h=1422&fit=crop',
  'https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=800&h=1422&fit=crop',

function fmtFecha(iso){
  // iso = "2026-09-10" → "Miércoles 10 de septiembre"
  const [y,m,d] = iso.split('-').map(Number);
  const date = new Date(y,m-1,d);
  const day = DAYS_ES[date.getDay()];
  return `${day.charAt(0).toUpperCase()+day.slice(1)} ${d} de ${MONTHS_ES_LONG[m-1]}`;
}

function saveStoryModal(){
  const caption = document.getElementById('smod-caption').value.trim();
  const img = document.getElementById('smod-img').value.trim() || UNSPLASH_ALL[0];
  const time = document.getElementById('smod-time').value.trim() || '09:00';
  if(!caption){ document.getElementById('smod-caption').focus(); return; }
  const { clientId, groupId, storyId, isNew } = storyEditCtx;
  const c = getClient(clientId);
  const g = c.grupos.find(x=>x.id===groupId);
  g.hora = time;
  if(isNew){
    g.stories.push({ id:uid(), text:caption, img });
  } else {
    const s = g.stories.find(x=>x.id===storyId);
    s.text = caption; s.img = img;
  }
  closeStoryModal();
  renderMain();
  if(currentTab==='calendario') renderCalDayStories();
}

function sendWA(clientId){

  const token = c.id+'x7f2';
  const url = `${window.location.origin}/aprobar/${token}`;
  const g = c.grupos[0];
  const msg = `Hola ${c.name} 👋 Tus historias de Instagram para el ${g?fmtFecha(g.fecha):'esta semana'} están listas.\n\nRevisalas y aprobá en 30 segundos 👇\n${url}\n\n_Link válido por 48 hs_`;
  window.open(`https://wa.me/${c.phone.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`,'_blank');
  c.status = 'sent'; renderMain();
}

// ── CALENDAR ─────────────────────────────────────────────────────────
function changeMonth(d){ calMonth+=d; if(calMonth<0){calMonth=11;calYear--;}if(calMonth>11){calMonth=0;calYear++;} renderCalendar(); }

function allPostsOnDay(y,m,d){
  const iso = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const results = [];
  CLIENTS.forEach(c=>c.grupos.filter(g=>g.fecha===iso).forEach(g=>results.push({c,g})));
  return results;
}

function renderCalendar(){
  document.getElementById('cal-month-label').textContent = `${MONTHS_ES[calMonth]} ${calYear}`;
  const grid = document.getElementById('cal-grid'); grid.innerHTML='';
  const firstDay = new Date(calYear,calMonth,1).getDay();
  const daysInMonth = new Date(calYear,calMonth+1,0).getDate();
  const daysInPrev = new Date(calYear,calMonth,0).getDate();
  const td = new Date();
  for(let i=0;i<firstDay;i++){const cell=document.createElement('div');cell.className='cal-cell empty';cell.textContent=daysInPrev-firstDay+1+i;grid.appendChild(cell);}
  for(let d=1;d<=daysInMonth;d++){
    const cell=document.createElement('div');
    const isToday=d===td.getDate()&&calMonth===td.getMonth()&&calYear===td.getFullYear();
    const isSel=selectedCalDay===d;
    const hasPosts=allPostsOnDay(calYear,calMonth+1,d).length>0;
    let cls='cal-cell';
    if(isSel)cls+=' selected'; else if(isToday)cls+=' today';
    if(hasPosts)cls+=' has-post';
    cell.className=cls; cell.textContent=d;
    const _d=d; cell.onclick=()=>selectCalDay(_d);
    grid.appendChild(cell);
  }
  const total=firstDay+daysInMonth; const rem=total%7===0?0:7-(total%7);
  for(let i=1;i<=rem;i++){const cell=document.createElement('div');cell.className='cal-cell empty';cell.textContent=i;grid.appendChild(cell);}
}

function selectCalDay(d){
  selectedCalDay=d;
  renderCalendar();
  const [y,m]=[calYear,calMonth+1];
  const date=new Date(y,m-1,d);
  document.getElementById('cal-day-title').textContent=`${DAYS_ES[date.getDay()].charAt(0).toUpperCase()+DAYS_ES[date.getDay()].slice(1)} ${d} de ${MONTHS_ES_LONG[m-1]}`;
  const posts=allPostsOnDay(y,m,d);
  document.getElementById('cal-day-sub').textContent=posts.length?`${posts.reduce((acc,{g})=>acc+g.stories.length,0)} historia(s) en ${posts.length} grupo(s)`:'Sin publicaciones';
  document.getElementById('btn-add-cal').style.display='inline-block';
  renderCalDayStories();
}

function renderCalDayStories(){
  if(!selectedCalDay){return;}
  const posts=allPostsOnDay(calYear,calMonth+1,selectedCalDay);
  const cont=document.getElementById('cal-day-stories');
  if(!posts.length){cont.innerHTML='<div class="empty-day">✏️ No hay historias este día.<br>Hacé click en "+ Historia" para agregar.</div>';return;}
  cont.innerHTML=posts.map(({c,g})=>g.stories.map((s,si)=>`
    <div class="day-story-row">
      <img class="day-thumb" src="${s.img}" alt="">
      <div class="day-story-info">
        <div class="day-story-num">${c.name} · #${si+1} · ${g.hora}hs</div>
        <div class="day-story-cap">${s.text}</div>
      </div>
      <div class="day-story-actions">
        <button class="btn-icon" onclick="openStoryModal('${c.id}','${g.id}','${s.id}')">✏️</button>
        <button class="btn-icon" onclick="deleteCalStory('${c.id}','${g.id}','${s.id}')">🗑</button>
      </div>
    </div>`).join('')).join('');
}

function addStoryFromCal(){
  // Pick first client with a group on this day, or first client
  const posts=allPostsOnDay(calYear,calMonth+1,selectedCalDay);
  if(posts.length){
    const {c,g}=posts[0];
    addNewStory(c.id,g.id);
  } else {
    openGroupModal(currentClientId);
  }
}

function deleteCalStory(clientId,groupId,storyId){
  const c=getClient(clientId); const g=c.grupos.find(x=>x.id===groupId);
  g.stories=g.stories.filter(s=>s.id!==storyId);
  renderCalDayStories(); renderCalendar(); renderMain();
}
