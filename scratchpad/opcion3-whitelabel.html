<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Panel Storias — Opción 3</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap">
  <style>
    :root{--bg:#F5F1E8;--surface:#EDE8DC;--border:#D5CCBA;--fg:#1C1410;--muted:#6B5F52;--accent:#C94F1A;--accent2:#A83D12;--drawer-w:256px}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--fg);font-family:'Geist',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;display:flex;flex-direction:column}

    /* ── NAV ── */
    nav{display:flex;align-items:center;gap:10px;padding:0 20px;height:54px;border-bottom:1px solid var(--border);background:rgba(245,241,232,.95);backdrop-filter:blur(12px);position:sticky;top:0;z-index:50;flex-shrink:0}
    .hamburger{background:none;border:none;cursor:pointer;font-size:20px;color:var(--fg);width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:8px;transition:background .15s}
    .hamburger:hover{background:var(--surface)}
    .logo{font-size:16px;font-weight:800;letter-spacing:-.04em}
    .logo span{color:var(--accent)}
    .client-pill{display:flex;align-items:center;gap:7px;margin-left:auto;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:4px 12px 4px 6px;cursor:pointer;font-size:12px;font-weight:600;transition:border-color .15s}
    .client-pill:hover{border-color:var(--accent)}

    /* ── DRAWER ── */
    .drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:90;opacity:0;pointer-events:none;transition:opacity .25s}
    .drawer-overlay.open{opacity:1;pointer-events:all}
    .drawer{position:fixed;top:0;left:0;bottom:0;width:var(--drawer-w);background:var(--bg);border-right:1px solid var(--border);z-index:100;transform:translateX(-100%);transition:transform .25s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
    .drawer.open{transform:translateX(0)}
    .drawer-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
    .drawer-head .logo{font-size:15px}
    .close-btn{background:none;border:none;cursor:pointer;font-size:17px;color:var(--muted);width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:6px}
    .close-btn:hover{background:var(--surface)}
    .drawer-search{padding:8px 12px;border-bottom:1px solid var(--border)}
    .drawer-search input{width:100%;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-size:13px;color:var(--fg);font-family:inherit}
    .drawer-search input:focus{outline:none;border-color:var(--accent)}
    .drawer-list{flex:1;overflow-y:auto;padding:6px 0}
    .drawer-item{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;transition:background .1s;font-size:13px;font-weight:500}
    .drawer-item:hover{background:var(--surface)}
    .drawer-item.active{background:rgba(201,79,26,.08);color:var(--accent)}
    .status-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-left:auto}
    .dot-p{background:#F59E0B}.dot-s{background:#6366F1}.dot-a{background:#10B981}
    .drawer-footer{padding:10px;border-top:1px solid var(--border)}
    .btn-new{width:100%;padding:8px;border-radius:8px;border:1.5px dashed var(--border);background:transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
    .btn-new:hover{border-color:var(--accent);color:var(--accent)}

    /* ── LAYOUT: stories left + calendar right ── */
    .layout{display:flex;flex:1;overflow:hidden}
    .content{flex:1;overflow-y:auto;padding:28px 24px;min-width:0}
    .cal-sidebar{width:256px;flex-shrink:0;border-left:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}

    /* ── CLIENT HEADER ── */
    .client-header{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
    .ca-lg{width:42px;height:42px;border-radius:50%;font-size:14px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .client-header h2{font-size:20px;font-weight:800;letter-spacing:-.02em}
    .client-header p{font-size:12px;color:var(--muted);margin-top:2px}
    .header-btns{margin-left:auto;display:flex;gap:6px}
    .btn-accent{padding:7px 13px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s}
    .btn-accent:hover{background:var(--accent2)}
    .btn-outline{padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
    .btn-outline:hover{border-color:var(--fg);color:var(--fg)}

    /* ── WEEK BLOCKS ── */
    .week-block{margin-bottom:24px}
    .week-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;flex-wrap:wrap}
    .week-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
    .badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px}
    .badge-p{background:rgba(245,158,11,.12);color:#B45309}
    .badge-s{background:rgba(99,102,241,.1);color:#6366F1}
    .badge-a{background:rgba(16,185,129,.1);color:#059669}
    /* ── CAROUSEL ── */
    .carousel-outer{position:relative;margin-bottom:10px}
    .carousel{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:3px 3px 6px;-webkit-overflow-scrolling:touch}
    .carousel::-webkit-scrollbar{height:3px}
    .carousel::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
    .carousel::-webkit-scrollbar-track{background:transparent}
    .story-card{flex:0 0 calc(25% - 6px);min-width:72px;scroll-snap-align:start;border-radius:10px;overflow:hidden;aspect-ratio:9/16;position:relative;background:#1a1a1a;cursor:pointer;transition:transform .15s;flex-shrink:0}
    .story-card:hover{box-shadow:0 0 0 2px var(--accent)}
    .story-card.approved{box-shadow:0 0 0 2.5px #10B981 inset}
    .check-badge{position:absolute;top:6px;right:6px;background:#10B981;color:#fff;width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;z-index:15}
    .story-card img{width:100%;height:100%;object-fit:cover;display:block}
    .story-card .overlay{position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.75));display:flex;align-items:flex-end;padding:8px}
    .story-text{font-size:9px;color:#fff;line-height:1.3;font-weight:500}
    .num-badge{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.5);color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:99px;backdrop-filter:blur(4px)}
    .edit-hover{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
    .story-card:hover .edit-hover{opacity:1}
    .btn-edit-story{background:rgba(255,255,255,.9);border:none;border-radius:7px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
    .add-story-card{flex:0 0 calc(25% - 6px);min-width:72px;scroll-snap-align:start;border:1.5px dashed var(--border);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:10px;aspect-ratio:9/16;transition:border-color .15s;flex-shrink:0}
    .add-story-card:hover{border-color:var(--accent)}
    .add-story-card div{text-align:center;color:var(--muted);font-size:11px;font-weight:600}
    .action-bar{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--border);flex-wrap:wrap}
    .btn-wa{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:8px;border:none;background:#25D366;color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
    .btn-wa:hover{background:#1db954}
    .btn-prev{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
    .btn-del-group{padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;margin-left:auto}
    .btn-del-group:hover{border-color:#ef4444;color:#ef4444}
    .btn-del-story{position:absolute;top:5px;right:5px;z-index:20;width:20px;height:20px;border-radius:50%;border:none;background:rgba(0,0,0,.65);color:#fff;font-size:13px;font-weight:700;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;padding:0}
    .story-card:hover .btn-del-story{opacity:1}
    .reorder-btns{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);display:flex;gap:3px;opacity:0;transition:opacity .15s;z-index:20}
    .story-card:hover .reorder-btns{opacity:1}
    .btn-move{width:22px;height:22px;border-radius:5px;border:none;background:rgba(0,0,0,.65);color:#fff;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;backdrop-filter:blur(4px)}
    .empty-client{padding:52px 20px;text-align:center;color:var(--muted)}
    .empty-client .icon{font-size:36px;margin-bottom:12px}
    .empty-client p{font-size:13px;line-height:1.6;margin-bottom:16px}

    /* ── CAL SIDEBAR ── */
    .cal-header{padding:14px 14px 10px;border-bottom:1px solid var(--border)}
    .cal-header-title{font-size:12px;font-weight:800;letter-spacing:-.01em;margin-bottom:2px}
    .cal-header-sub{font-size:11px;color:var(--muted)}
    .cal-body{padding:12px 10px}
    .cal-month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .cal-month-name{font-size:12px;font-weight:700}
    .cal-nav-btn{width:24px;height:24px;border-radius:6px;border:1px solid var(--border);background:transparent;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
    .cal-nav-btn:hover{background:var(--border)}
    .cal-days-row{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
    .cal-day-name{text-align:center;font-size:9px;font-weight:700;color:var(--muted);padding:3px 0}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
    .cal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;position:relative;transition:background .1s}
    .cal-cell:hover:not(.empty){background:var(--border)}
    .cal-cell.empty{cursor:default;color:rgba(28,20,16,.25);font-size:10px}
    .cal-cell.today{background:rgba(201,79,26,.12);color:var(--accent);font-weight:800}
    .cal-cell.selected{background:var(--accent)!important;color:#fff!important}
    .cal-cell.has-post::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:var(--accent)}
    .cal-cell.selected.has-post::after{background:#fff}
    .cal-days-list{padding:0 10px 14px}
    .cal-sel-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
    .cal-day-chip{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);margin-bottom:5px;cursor:pointer;font-size:12px;font-weight:600;transition:border-color .1s}
    .cal-day-chip:hover{border-color:var(--accent)}
    .cal-day-chip.active-chip{border-color:var(--accent);background:rgba(201,79,26,.06);color:var(--accent)}
    .chip-remove{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;margin-left:auto;padding:0;line-height:1}
    .chip-remove:hover{color:#ef4444}
    .btn-add-day{width:100%;padding:8px;border-radius:8px;border:1.5px dashed var(--border);background:transparent;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:4px;transition:all .15s}
    .btn-add-day:hover{border-color:var(--accent);color:var(--accent)}

    /* ── MODALS ── */
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
    .modal-bg.open{display:flex}
    .modal{background:var(--bg);border:1px solid var(--border);border-radius:18px;width:100%;max-width:460px;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.18)}
    .modal.story-modal-wide{max-width:600px}
    .modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
    .modal-head h3{font-size:14px;font-weight:800}
    .modal-close{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:transparent;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
    .modal-body{padding:18px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
    .field label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
    .field input,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--fg);font-size:13px;font-family:inherit}
    .field input:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
    .field textarea{resize:none;line-height:1.5}
    .img-row{display:flex;gap:16px;align-items:flex-start}
    .img-prev-wrap{position:relative;height:min(58vh,360px);aspect-ratio:9/16;flex-shrink:0;border-radius:12px;overflow:hidden;background:var(--border)}
    .img-prev{width:100%;height:100%;object-fit:cover;display:block}
    .img-prev-overlay{position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.75));display:flex;align-items:flex-end;padding:10px}
    .img-prev-caption{font-size:9px;color:#fff;line-height:1.35;font-weight:500;word-break:break-word}
    .img-ctrls{flex:1;display:flex;flex-direction:column;gap:10px}
    .img-file-btn{width:100%;padding:9px;border-radius:9px;border:1.5px dashed var(--border);background:transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:border-color .15s}
    .img-file-btn:hover{border-color:var(--accent);color:var(--accent)}
    .btn-rand{padding:7px 10px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
    .btn-rand:hover{background:var(--border)}
    .modal-footer{padding:14px 18px;border-top:1px solid var(--border);display:flex;gap:8px}
    .btn-cancel-m{flex:1;padding:10px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
    .btn-save-m{flex:2;padding:10px;border-radius:9px;border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
    .btn-save-m:hover{background:var(--accent2)}

    .btn-back-menu{position:fixed;bottom:20px;right:20px;z-index:500;background:var(--accent);color:#fff;border:none;border-radius:99px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 16px rgba(201,79,26,.35)}

    .ca{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
  </style>
</head>
<body>

<button class="btn-back-menu" onclick="history.back()">← Menú de opciones</button>
<div class="drawer-overlay" id="overlay" onclick="closeDrawer()"></div>

<!-- Drawer -->
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="logo">Sto<span>.</span></div>
    <button class="close-btn" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-search">
    <input type="text" placeholder="Buscar cliente…" oninput="filterClients(this.value)">
  </div>
  <div class="drawer-list" id="drawer-list"></div>
  <div class="drawer-footer">
    <button class="btn-new" onclick="closeDrawer();openClientModal('new')">+ Nuevo cliente</button>
  </div>
</div>

<!-- Nav -->
<nav>
  <button class="hamburger" onclick="openDrawer()">☰</button>
  <div class="logo">Sto<span>.</span></div>
  <div class="client-pill" onclick="openDrawer()">
    <div class="ca" id="nav-avatar" style="background:#C94F1A">CA</div>
    <span id="nav-name">CUAN Arquitectura</span>
    <span style="color:var(--muted);margin-left:2px">▾</span>
  </div>
</nav>

<!-- Layout -->
<div class="layout">
  <!-- Left: stories content -->
  <div class="content" id="main-content"></div>

  <!-- Right: calendar -->
  <div class="cal-sidebar">
    <div class="cal-header">
      <div class="cal-header-title">📅 Calendario</div>
      <div class="cal-header-sub">Días de publicación</div>
    </div>
    <div class="cal-body">
      <div class="cal-month-nav">
        <button class="cal-nav-btn" onclick="calChange(-1)">‹</button>
        <div class="cal-month-name" id="cal-month-lbl"></div>
        <button class="cal-nav-btn" onclick="calChange(1)">›</button>
      </div>
      <div class="cal-days-row">
        <div class="cal-day-name">Do</div><div class="cal-day-name">Lu</div><div class="cal-day-name">Ma</div>
        <div class="cal-day-name">Mi</div><div class="cal-day-name">Ju</div><div class="cal-day-name">Vi</div><div class="cal-day-name">Sá</div>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
    <div class="cal-days-list">
      <div class="cal-sel-title">Días programados</div>
      <div id="day-chips"></div>
      <button class="btn-add-day" onclick="openPubModal()">+ Agregar día</button>
    </div>
  </div>
</div>

<!-- Story edit modal -->
<input type="file" id="smod-file" accept="image/*" style="display:none" onchange="loadImgFile3(this)">
<div class="modal-bg" id="story-modal">
  <div class="modal story-modal-wide">
    <div class="modal-head"><h3 id="smod-title">Editar historia</h3><button class="modal-close" onclick="closeStoryModal()">✕</button></div>
    <div class="modal-body">
      <div class="img-row">
        <div class="img-prev-wrap">
          <img class="img-prev" id="smod-prev" src="" alt="">
          <div class="img-prev-overlay"><div class="img-prev-caption" id="smod-prev-cap"></div></div>
        </div>
        <div class="img-ctrls">
          <div class="field"><label>Texto superpuesto</label><textarea id="smod-cap" rows="4" placeholder="Texto sobre la imagen…" oninput="document.getElementById('smod-prev-cap').textContent=this.value"></textarea></div>
          <div class="field"><label>URL de imagen</label><input type="text" id="smod-img" placeholder="https://…" oninput="updPrev(this.value)"></div>
          <button class="img-file-btn" onclick="document.getElementById('smod-file').click()">📁 Seleccionar imagen del dispositivo</button>
          <button class="btn-rand" onclick="randImg()">🔀 Imagen aleatoria</button>
          <div class="field"><label>Hora</label><input type="text" id="smod-time" placeholder="09:00"></div>
        </div>
      </div>
    </div>
    <div class="modal-footer"><button class="btn-cancel-m" onclick="closeStoryModal()">Cancelar</button><button class="btn-save-m" onclick="saveStoryModal()">Guardar</button></div>
  </div>
</div>

<!-- Client modal -->
<div class="modal-bg" id="client-modal">
  <div class="modal">
    <div class="modal-head"><h3 id="cmod-title">Nuevo cliente</h3><button class="modal-close" onclick="closeClientModal()">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>Empresa</label><input id="cmod-empresa" type="text" placeholder="CUAN Arquitectura"></div>
      <div class="field"><label>Contacto</label><input id="cmod-contacto" type="text" placeholder="Lucía Cuan"></div>
      <div class="field"><label>Descripción</label><textarea id="cmod-desc" rows="2" placeholder="Estudio de arquitectura…"></textarea></div>
      <div class="field"><label>WhatsApp</label><input id="cmod-phone" type="text" placeholder="+54 9 11 1234-5678"></div>
    </div>
    <div class="modal-footer"><button class="btn-cancel-m" onclick="closeClientModal()">Cancelar</button><button class="btn-save-m" onclick="saveClientModal()">Guardar</button></div>
  </div>
</div>

<!-- Add publication modal -->
<div class="modal-bg" id="pub-modal">
  <div class="modal">
    <div class="modal-head"><h3>Nueva publicación</h3><button class="modal-close" onclick="closePubModal()">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>Fecha</label><input id="pub-fecha" type="date"></div>
      <div class="field"><label>Hora</label><input id="pub-hora" type="time" value="09:00"></div>
    </div>
    <div class="modal-footer"><button class="btn-cancel-m" onclick="closePubModal()">Cancelar</button><button class="btn-save-m" onclick="savePubModal()">Agregar</button></div>
  </div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────
const IMGS=[
  'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=400&h=711&fit=crop',

function getC(id){return CLIENTS.find(c=>c.id===id);}
function fmtFecha(iso){const[y,m,d]=iso.split('-').map(Number);const dt=new Date(y,m-1,d);return `${cap(DAYS_L[dt.getDay()])} ${d} de ${MONTHS_L[m-1]}`;}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function pad(n){return String(n).padStart(2,'0');}

// ── DRAWER ──────────────────────────────────────────────────────
function openDrawer(){document.getElementById('drawer').classList.add('open');document.getElementById('overlay').classList.add('open');renderDrawer();}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('overlay').classList.remove('open');}
function renderDrawer(filter=''){
  const list=document.getElementById('drawer-list'); list.innerHTML='';
  CLIENTS.filter(c=>c.name.toLowerCase().includes(filter.toLowerCase())).forEach(c=>{
    const div=document.createElement('div');
    div.className='drawer-item'+(c.id===currentClientId?' active':'');
    div.innerHTML=`<div class="ca" style="background:${c.color}">${c.initials}</div><span>${c.name}</span><div class="status-dot ${DOT[c.status]}"></div>`;
    div.onclick=()=>{selectClient(c.id);closeDrawer();};
    list.appendChild(div);
  });
}
function filterClients(v){renderDrawer(v);}
function selectClient(id){
  currentClientId=id;selectedDay=null;
  const c=getC(id);
  document.getElementById('nav-avatar').style.background=c.color;
  document.getElementById('nav-avatar').textContent=c.initials;
  document.getElementById('nav-name').textContent=c.name;
  renderMain(); renderCalendar(); renderDayChips();
}

    <div class="empty-client">
      <div class="icon">📭</div>
      <p>Sin publicaciones programadas para <strong>${c.name}</strong></p>
      <button class="btn-accent" onclick="openPubModal()">+ Agregar publicación</button>

// ── STORY MODAL ──────────────────────────────────────────────────
function openStoryModal(cid,gid,sid){
  const c=getC(cid),g=c.grupos.find(x=>x.id===gid),s=g.stories.find(x=>x.id===sid);
  storyCtx={cid,gid,sid,isNew:false};
  document.getElementById('smod-title').textContent='Editar historia';
  document.getElementById('smod-cap').value=s.text;
  document.getElementById('smod-prev-cap').textContent=s.text;
  document.getElementById('smod-img').value=s.img;
  document.getElementById('smod-prev').src=s.img;
  document.getElementById('smod-time').value=g.hora;
  document.getElementById('story-modal').classList.add('open');
}
function addNewStory(cid,gid){
  const img=IMGS[Math.floor(Math.random()*IMGS.length)];
  storyCtx={cid,gid,sid:null,isNew:true};
  document.getElementById('smod-title').textContent='Nueva historia';
  document.getElementById('smod-cap').value='';
  document.getElementById('smod-prev-cap').textContent='';
  document.getElementById('smod-img').value=img;
  document.getElementById('smod-prev').src=img;
  document.getElementById('smod-time').value='09:00';
  document.getElementById('story-modal').classList.add('open');
}
function closeStoryModal(){document.getElementById('story-modal').classList.remove('open');}
function updPrev(url){document.getElementById('smod-prev').src=url;}
function randImg(){const u=IMGS[Math.floor(Math.random()*IMGS.length)];document.getElementById('smod-img').value=u;document.getElementById('smod-prev').src=u;}
function loadImgFile3(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{document.getElementById('smod-prev').src=e.target.result;document.getElementById('smod-img').value=e.target.result;};r.readAsDataURL(f);input.value='';}
function saveStoryModal(){
  const cap=document.getElementById('smod-cap').value.trim();
  const img=document.getElementById('smod-img').value.trim()||IMGS[0];
  const time=document.getElementById('smod-time').value||'09:00';
  if(!cap){document.getElementById('smod-cap').focus();return;}
  const{cid,gid,sid,isNew}=storyCtx;
  const c=getC(cid),g=c.grupos.find(x=>x.id===gid);
  g.hora=time;
  if(isNew)g.stories.push({id:uid(),text:cap,img});
  else{const s=g.stories.find(x=>x.id===sid);s.text=cap;s.img=img;}
  closeStoryModal(); renderMain(); renderCalendar(); renderDayChips();
}

// ── PUB MODAL ────────────────────────────────────────────────────
function openPubModal(){
  const t=new Date();
  document.getElementById('pub-fecha').value=`${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;
  document.getElementById('pub-hora').value='09:00';
  document.getElementById('pub-modal').classList.add('open');
}
function closePubModal(){document.getElementById('pub-modal').classList.remove('open');}
function savePubModal(){
  const fecha=document.getElementById('pub-fecha').value;
  const hora=document.getElementById('pub-hora').value||'09:00';
  if(!fecha)return;
  const c=getC(currentClientId);
  c.grupos.push({id:uid(),fecha,hora,stories:[]});
  c.grupos.sort((a,b)=>a.fecha.localeCompare(b.fecha));
  closePubModal(); selectedDay=fecha;
  renderMain(); renderCalendar(); renderDayChips();
  setTimeout(()=>{const c=getC(currentClientId);const g=c.grupos.find(x=>x.fecha===fecha);if(g){const el=document.getElementById('grp-'+g.id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}},50);
}

// ── CLIENT MODAL ─────────────────────────────────────────────────
function openClientModal(mode){
  const c=mode==='edit'?getC(currentClientId):null;
  document.getElementById('cmod-title').textContent=mode==='edit'?'Editar cliente':'Nuevo cliente';
  document.getElementById('cmod-empresa').value=c?.name||'';
  document.getElementById('cmod-contacto').value=c?.contacto||'';
  document.getElementById('cmod-desc').value='';
  document.getElementById('cmod-phone').value=c?.phone||'';
  document.getElementById('client-modal').dataset.mode=mode;
  document.getElementById('client-modal').classList.add('open');
}
function closeClientModal(){document.getElementById('client-modal').classList.remove('open');}
function saveClientModal(){
  const name=document.getElementById('cmod-empresa').value.trim();if(!name)return;
  const mode=document.getElementById('client-modal').dataset.mode;
  const COLORS=['#C94F1A','#6366F1','#0EA5E9','#10B981','#F59E0B'];
  if(mode==='edit'){
    const c=getC(currentClientId);c.name=name;c.contacto=document.getElementById('cmod-contacto').value;c.phone=document.getElementById('cmod-phone').value;
  }else{
    const words=name.trim().split(' ');const initials=(words[0][0]+(words[1]?words[1][0]:'')).toUpperCase();
    const nc={id:uid(),name,initials,color:COLORS[CLIENTS.length%COLORS.length],
      phone:document.getElementById('cmod-phone').value,contacto:document.getElementById('cmod-contacto').value,status:'pending',grupos:[]};
    CLIENTS.push(nc);currentClientId=nc.id;
  }
  closeClientModal();selectClient(currentClientId);
}

// ── DELETE ────────────────────────────────────────────────────────
function toggleApproveStory(cid,gid,sid){
  const c=getC(cid),g=c.grupos.find(x=>x.id===gid),s=g.stories.find(x=>x.id===sid);
  s.approved=!s.approved;
  renderMain();
}
function removeStory(cid,gid,sid){
  const c=getC(cid),g=c.grupos.find(x=>x.id===gid);
  g.stories=g.stories.filter(s=>s.id!==sid);
  renderMain();
}
function moveStory(cid,gid,sid,dir){
  const c=getC(cid),g=c.grupos.find(x=>x.id===gid);
  const idx=g.stories.findIndex(s=>s.id===sid);
  const ni=idx+dir;
  if(ni<0||ni>=g.stories.length)return;
  [g.stories[idx],g.stories[ni]]=[g.stories[ni],g.stories[idx]];
  renderMain();
}
function deleteGroup(cid,gid){
  const c=getC(cid);
  const g=c.grupos.find(x=>x.id===gid);
  const label=g?fmtFecha(g.fecha):'este día';
  if(!confirm(`¿Eliminar ${label} y todas sus historias?`))return;
  c.grupos=c.grupos.filter(g=>g.id!==gid);
  renderMain(); renderCalendar(); renderDayChips();
}

// ── WA ────────────────────────────────────────────────────────────
function sendWA(cid){
  const c=getC(cid),g=c.grupos[0];
  const url=`${window.location.origin}/aprobar/${c.id}x7f2`;
  const msg=`Hola ${c.name} 👋 Tus historias de Instagram para el ${g?fmtFecha(g.fecha):'esta semana'} están listas.\n\nRevisalas y aprobá en 30 segundos 👇\n${url}\n\n_Link válido por 48 hs_`;
  window.open(`https://wa.me/${c.phone.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`,'_blank');
  c.status='sent';renderMain();renderDrawer();
}

// ── CALENDAR ─────────────────────────────────────────────────────
function calChange(d){calM+=d;if(calM<0){calM=11;calY--;}if(calM>11){calM=0;calY++;}renderCalendar();}
function clientDaySet(){return new Set(getC(currentClientId).grupos.map(g=>g.fecha));}

function renderCalendar(){
  document.getElementById('cal-month-lbl').textContent=`${MONTHS[calM]} ${calY}`;
  const grid=document.getElementById('cal-grid');grid.innerHTML='';
  const first=new Date(calY,calM,1).getDay();
  const daysN=new Date(calY,calM+1,0).getDate();
  const prevN=new Date(calY,calM,0).getDate();
  const td=new Date();
  const days=clientDaySet();
  for(let i=0;i<first;i++){const c=document.createElement('div');c.className='cal-cell empty';c.textContent=prevN-first+1+i;grid.appendChild(c);}
  for(let d=1;d<=daysN;d++){
    const iso=`${calY}-${pad(calM+1)}-${pad(d)}`;
    const cell=document.createElement('div');
    const isT=d===td.getDate()&&calM===td.getMonth()&&calY===td.getFullYear();
    const isS=selectedDay===iso;
    const hasP=days.has(iso);
    let cls='cal-cell';if(isS)cls+=' selected';else if(isT)cls+=' today';if(hasP)cls+=' has-post';
    cell.className=cls;cell.textContent=d;
    cell.onclick=()=>{
      selectedDay=iso; renderCalendar(); renderDayChips();
      const c=getC(currentClientId);
      const exists=c&&c.grupos.find(g=>g.fecha===iso);
      if(exists){
        const el=document.getElementById('grp-'+exists.id);
        if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
      } else if(c){
        // crear el día directo, sin modal
        const newG={id:uid(),fecha:iso,hora:'09:00',stories:[]};
        c.grupos.push(newG);
        c.grupos.sort((a,b)=>a.fecha.localeCompare(b.fecha));
        renderMain(); renderCalendar(); renderDayChips();
        setTimeout(()=>{const el=document.getElementById('grp-'+newG.id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},50);
      }
    };
    grid.appendChild(cell);
  }
  const total=first+daysN;const rem=total%7===0?0:7-(total%7);
  for(let i=1;i<=rem;i++){const c=document.createElement('div');c.className='cal-cell empty';c.textContent=i;grid.appendChild(c);}
}

function renderDayChips(){
  const c=getC(currentClientId);
  const chips=document.getElementById('day-chips');
  chips.innerHTML=c.grupos.length
    ?c.grupos.map(g=>`
      <div class="cal-day-chip${selectedDay===g.fecha?' active-chip':''}" onclick="(function(){selectedDay='${g.fecha}';renderCalendar();renderDayChips();const el=document.getElementById('grp-${g.id}');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});})()">
        <span style="flex:1">${fmtFecha(g.fecha).split(' ').slice(0,3).join(' ')}</span>
        <button class="chip-remove" onclick="event.stopPropagation();deleteGroup('${c.id}','${g.id}')">×</button>
      </div>`).join('')
    :'<div style="font-size:11px;color:var(--muted);padding:4px 0">Sin días programados</div>';
}

// ── ESC + overlay close ──────────────────────────────────────────
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeStoryModal();closeClientModal();closePubModal();}});
['story-modal','client-modal','pub-modal'].forEach(id=>{
  document.getElementById(id).addEventListener('click',function(e){if(e.target===this)this.classList.remove('open');});
});

// ── INIT ─────────────────────────────────────────────────────────
renderDrawer();
renderMain();
renderCalendar();
renderDayChips();
</script>
